<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mute Defaults</title>
    <script src="settings.js"></script>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: #202124;
        background-color: #ffffff;
        box-sizing: border-box;
      }

      h2 {
        margin: 0 0 14px 0;
        font-size: 16px;
        font-weight: 600;
      }

      h2 a {
        color: #1a73e8;
        text-decoration: none;
      }

      h2 a:hover {
        text-decoration: underline;
      }

      .option {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        cursor: pointer;
        user-select: none;
      }

      .option input[type="checkbox"] {
        margin: 0 10px 0 0;
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #1a73e8;
      }

      .footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #e8eaed;
        font-size: 11px;
        color: #5f6368;
      }

      .footer a {
        color: #1a73e8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <h2><a href="https://github.com/a-domingos/MuteDefaults" target="_blank">Mute Defaults</a></h2>

    <label class="option">
      <input type="checkbox" id="muteMicrophone" name="muteMicrophone" />
      <span>Mute microphone automatically</span>
    </label>

    <label class="option">
      <input type="checkbox" id="muteCamera" name="muteCamera" />
      <span>Mute camera automatically</span>
    </label>

    <div class="footer">
      For support visit <a href="https://github.com/a-domingos/MuteDefaults/issues" target="_blank">Mute Defaults</a> on GitHub.
    </div>
  </body>
</html>
